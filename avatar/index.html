<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>David Twenty · avatar vocal</title>
<link rel="icon" href="../images/icon-192.png">
<link rel="stylesheet" href="avatar.css">
</head>
<body>
<main id="app">
  <canvas id="face" aria-label="David Twenty"></canvas>
  <div id="status" aria-live="polite"></div>
  <div id="micinfo"><span id="mic"></span><select id="micsel" hidden aria-label="Micro"></select><div id="meter"><div id="meter-bar"></div></div></div>
  <div id="caption"><p id="cap-user"></p><p id="cap-bot"></p></div>
  <pre id="diag" hidden></pre>
  <div id="profil" hidden>
    <textarea id="profil-text" rows="7" aria-label="Profil de David Twenty"></textarea>
    <div><button id="profil-save">Enregistrer</button> <button id="profil-reset">Profil par défaut</button></div>
  </div>
  <div id="controls">
    <button id="start" class="primary">Commencer la conversation</button>
    <button id="mute" hidden aria-pressed="false">Couper le micro</button>
    <button id="cut" hidden>Interrompre</button>
    <button id="stop" hidden>Terminer</button>
    <button id="head">Tête</button>
    <button id="voice">Voix</button>
    <button id="pitch-down" title="Voix plus grave">− Grave</button>
    <button id="pitch-up" title="Voix plus aiguë">+ Aigu</button>
    <span id="pitch-info"></span>
    <button id="rec">Enregistrer une voix</button>
    <button id="profil-btn">Profil</button>
  </div>
  <p id="note">Parlez naturellement : David Twenty vous écoute pendant qu'il parle, vous pouvez l'interrompre à tout moment.</p>
</main>
<script src="../config-cles.js"></script>
<script src="face.js"></script>
<script src="rabbit.js"></script>
<script src="avatar.js"></script>
</body>
</html>
